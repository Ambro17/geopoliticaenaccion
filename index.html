            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        let currentGraph = null;

        const analysisDataCache = {"2025-10-4-Medio-Oriente.html": {"summary": "<div class='analysis-content'><p>El podcast inicia un viraje desde el análisis histórico hacia la coyuntura actual, enfocándose en la dinámica del Medio Oriente como uno de los escenarios geopolíticos más relevantes globalmente. Los expertos buscan ofrecer una visión abarcativa de la región, destacando el juego de los principales actores como Arabia Saudita, Israel, Turquía e Irán, y los hechos que reflejan la complejidad de sus interacciones.</p><p>Se profundiza en la definición del Medio Oriente, distinguiendo entre concepciones geográficas y conceptuales, así como las visiones estática y móvil que permiten la entrada y salida de actores. Se subraya la constante influencia de poderes externos, desde Europa hasta Estados Unidos y China, en la configuración y las fracturas internas de la región, que van más allá de las diferencias religiosas o étnicas.</p><p>El análisis resalta que la creación de los estados modernos en el Medio Oriente estuvo ligada históricamente a los intereses de potencias externas para controlar rutas comerciales y recursos energéticos vitales. Estos factores continúan siendo centrales en la proyección actual de grandes potencias como Estados Unidos y China, que buscan asegurar flujos energéticos y rutas estratégicas.</p><p>Finalmente, el episodio explora la estrategia de \"inestabilidad controlada\" de Estados Unidos, argumentando que sus intervenciones fueron exitosas en términos de control estratégico sobre los flujos energéticos y la dinámica regional, más que en la promoción de la democracia. El ataque de Hamás del 7 de octubre de 2023 es presentado como un evento que interrumpió procesos de paz y reconfiguró la iniciativa geopolítica, reafirmando el papel de Estados Unidos.</p></div>", "highlights": "<div class='analysis-content'><ul><li>\"No todo árabe es musulmán, no todo musulmán es árabe\", una distinción fundamental para comprender la diversidad de la región y desmentir confusiones comunes.</li><li>La cuestión religiosa en Medio Oriente es un factor que condiciona la geopolítica, pero no es determinante; las alianzas y conflictos a menudo se rigen por intereses hegemónicos y territoriales, no por afiliaciones religiosas lineales.</li><li>El profeta Mahoma fue no solo un líder religioso, sino también un líder político que estableció normas de convivencia y condujo una comunidad, una dualidad que perdura en la conciencia de los pueblos islámicos y dificulta la separación entre el ámbito religioso y político en los líderes actuales.</li><li>Las intervenciones de Estados Unidos en Medio Oriente pueden considerarse exitosas no en la instauración de la democracia o los derechos humanos, sino en el control estratégico de la región y sus flujos energéticos, manteniendo una \"inestabilidad controlada\" que beneficia sus intereses geopolíticos.</li><li>El ataque de Hamás del 7 de octubre de 2023 interrumpió procesos avanzados de normalización de relaciones entre países árabes e Israel, y entre árabes y persas, que podrían haber modificado significativamente la dinámica geopolítica regional, reestableciendo la iniciativa de Estados Unidos.</li></ul></div>", "references": "<div class='analysis-content'></div>", "transcript": "2025-10-4-Medio-Oriente.txt"}, "2025-12-16-Chile.html": {"summary": "<div class='analysis-content'><p>El podcast inicia explorando la hipótesis de una confederación de países del Cono Sur, principalmente Argentina y Chile, para lograr un control bioceánico del Atlántico y Pacífico Sur, asegurar el paso interoceánico, y proyectar influencia antártica. Esta unión se plantearía en alianza con Estados Unidos, excluyendo la injerencia de potencias extracontinentales.</p><p>Se argumenta que las actuales divisiones fronterizas entre Argentina y Chile, así como la creación de Uruguay, fueron resultados de la estrategia británica de \"divide y reinarás\" en el siglo XIX, diseñada para evitar que una única potencia regional controlara puntos estratégicos clave. Esta manipulación histórica es presentada como un obstáculo fundamental para el desarrollo geopolítico del Cono Sur.</p><p>La propuesta de confederación busca superar estas divisiones, enfrentar la creciente influencia de China a través de su \"Ruta de la Seda\" y su modelo de \"economías complementarias\" (criticado como una nueva forma de colonización), y redefinir la posición de la región frente a las injerencias de potencias europeas y las aspiraciones hegemónicas de Brasil. Se sugiere que una alianza con Estados Unidos, que muestra un renovado interés en el hemisferio, podría ofrecer estabilidad y beneficios.</p><p>Los hosts concluyen que la viabilidad de esta confederación dependerá de superar obstáculos ideológicos, como el nacionalismo en ambos países y el anti-americanismo de algunas izquierdas, para construir una unidad que permita al Cono Sur gestionar sus recursos estratégicos y pasos comerciales, alineándose con una visión de unidad continental del Ártico al Antártico.</p></div>", "highlights": "<div class='analysis-content'><ul><li>La idea de que la frontera entre Argentina y Chile es un \"frente ficticio\" y que fue \"dibujada por Gran Bretaña\" para dividir el control de los océanos Atlántico y Pacífico Sur, impidiendo que una sola nación dominara puntos estratégicos.</li><li>La observación de que Gran Bretaña, actuando bajo la política de \"divide y reinarás\", falló sistemáticamente a favor de Argentina en disputas fronterizas con Chile hasta mediados del siglo XX, buscando evitar que cualquiera de los dos países controlara ambos océanos.</li><li>El análisis de que las ideologías, incluyendo el nacionalismo, son frecuentemente utilizadas como \"instrumentos\" o \"armas\" geopolíticas por las grandes potencias, citando cómo el chauvinismo entre Argentina y Chile beneficia directamente a quienes tienen intereses coloniales en la región.</li><li>La interpretación de la masiva movilización de la flota norteamericana (incluido el portaviones Gerald Ford) en Sudamérica como una señal del renovado y estratégico interés de Estados Unidos en la región para contener la fuerte injerencia china, en lugar de una respuesta a problemas menores como el narcotráfico.</li><li>La crítica a las \"economías complementarias\" con China, presentadas como un nuevo esquema de colonización que se traduce en la exportación de recursos naturales a bajo precio y una balanza comercial altamente deficitaria para países como Argentina, contrastando con el superávit de Brasil.</li></ul></div>", "references": "<div class='analysis-content'></div>", "transcript": "2025-12-16-Chile.txt"}, "2026-01-11-Venezuela.html": {"summary": "<div class='analysis-content'><p>La discusión aborda la evolución de la política estadounidense hacia América Latina, centrándose inicialmente en la situación en Venezuela en los últimos meses. Se destaca un giro explícito en la atención e intervención de Estados Unidos en su hemisferio bajo la administración de Donald Trump, con el objetivo de limitar la injerencia de potencias extracontinentales como China, Rusia y Europa. La reciente operación en Venezuela, que resultó en la \"extracción\" del presidente Maduro sin un cambio de régimen, se presenta como una demostración de poder, más que una intervención para imponer una nueva administración.</p><p>Este evento se enmarca en la gran estrategia estadounidense delineada desde la década de 1940: evitar la consolidación de un poder unificado en el continente euroasiático, un riesgo histórico que la llevó a aliarse con la URSS en la Segunda Guerra Mundial y que hoy se refleja en conflictos como la guerra de Ucrania. La administración Trump se caracteriza por un enfoque directo y pragmático, que prescinde de las justificaciones morales previas para sus intervenciones, mostrando que las superpotencias ya no requieren excusas para actuar en beneficio de sus intereses estratégicos.</p><p>La decisión de no entregar el poder en Venezuela a candidatos opositores respaldados por Europa (como Corina Machado) se interpreta como una reafirmación de la Doctrina Monroe y un esfuerzo por expulsar influencias europeas y chinas en la región, asegurando el control de recursos. Venezuela se convierte así en un \"caso anecdótico\" dentro de un mensaje más amplio de la hegemonía estadounidense a toda Sudamérica, lo que implica una potencial reconfiguración de mapas y alianzas en la región, desafiando la histórica influencia británica y europea.</p><p>Este reposicionamiento geopolítico estadounidense también se manifiesta en tensiones con Europa por el control del Ártico (Groenlandia y Canadá) y en una redefinición de la arquitectura de defensa global. Se argumenta que Estados Unidos, que ha dominado Europa desde 1945 imponiendo su moneda, sistema financiero y bases militares, busca ahora consolidar su influencia continental de manera total, desechando la hipocresía en sus relaciones con aliados tradicionales y enfrentando los desafíos de potencias rivales sin confrontación militar directa en su propia \"esfera\".</p></div>", "highlights": "<div class='analysis-content'><ul><li>\"Trump ha puesto honestamente lo que todos veíamos por debajo de la superficie: hoy por hoy ya el mundo no requiere de excusas. Es una cuestión que no habiendo un marco regulatorio jurídico que logre imponerse a las superpotencias, quien pueda hacerlo que beneficie estratégicamente a su nación a su país lo hará.\"</li><li>\"Lo más interesante no es quién queda sino quién no queda y quién no queda es Corina Machado... Es lógico que no van a ser el esfuerzo de sacar a Maduro para entregarle el poder a candidatos que responden Europa. Alcanza con ver la reacción de los dirigentes europeos... para darse cuenta quién es el sostén de esta mujer.\"</li><li>\"Rusia y Estados Unidos tienen intereses geopolíticos coincidentes, son lo que geopolíticamente se llama aliados naturales, históricamente... La preocupación rusa y norteamericana es la misma: sus vecinos son China y Europa.\"</li><li>\"El derecho internacional es muy importante, pero el punto es que el político no existe allá, porque no hay autoridad de aplicación... no hay derecho internacional, con lo cual lo único que hay es poder, y la última ratio del poder es el poder militar.\"</li><li>\"Está todo dado para que Argentina con el apoyo norteamericano recupere Malvinas y creo que dentro de ese combo viene que Montplesan pase a una concesión a Estados Unidos... Lo lógico sería que Estados Unidos tuviera Malvinas, no la jurisdicción... y sería razonable darle en concesión esa base militar y recuperar la jurisdicción argentina.\"</li></ul></div>", "references": "<div class='analysis-content'><ul><li>The Man in the High Castle</li><li>Spykman's book on the United States (1942)</li><li>The Economist</li></ul></div>", "transcript": "2026-01-11-Venezuela.txt"}, "2025-08-27-2da-Guerra-Mundial.html": {"summary": "<div class='analysis-content'><p>El podcast \"Geopolítica en Acción\" aborda la Segunda Guerra Mundial desde una perspectiva de <i>realpolitik</i>, argumentando que comprender este conflicto es fundamental para entender el orden mundial actual. Los anfitriones, Mauro La Bombarda y Saturnino Funes, se enfocan en los intereses geopolíticos de los estados combatientes, despojando la narrativa de juicios morales y examinando quiénes lograron realmente sus objetivos políticos, desafiando las percepciones comunes sobre ganadores y perdedores.</p><p>Inicialmente, se analiza el período de entreguerras, destacando cómo la desaparición de los imperios centrales tras la Primera Guerra Mundial y la debilidad de Alemania crearon un vacío de poder que permitió la expansión de la Unión Soviética. Gran Bretaña, preocupada por este nuevo imperio expansivo y comunista, cometió el error de un Tratado de Versalles humillante pero no destructivo para Alemania, lo que finalmente llevó a la decisión británica de rearmar a Alemania, buscando un contrapeso anticomunista en la figura de Hitler para empujarlo hacia el este contra Rusia.</p><p>La narrativa progresa con la sorpresa del Pacto Ribbentrop-Molotov, donde Alemania y la Unión Soviética dividieron Polonia, frustrando las expectativas británicas. La subsiguiente \"guerra boba\" y la pasividad anglo-francesa en el frente occidental permitieron a Hitler consolidar su posición antes de su ofensiva hacia el oeste. Un punto crítico es el \"milagro de Dunkerque\", interpretado no como una retirada heroica sino como una oferta de Hitler a Gran Bretaña para que le permitiera la hegemonía continental a cambio de invadir la URSS. El misterioso viaje de Rudolf Hess a Escocia en 1941 precede la Operación Barbarroja, sugiriendo un acuerdo tácito que garantizó a Alemania un frente occidental seguro.</p><p>Finalmente, el podcast detalla cómo la invasión pan-europea de la Unión Soviética, la renuencia británica a abrir un segundo frente y la intervención tardía de Estados Unidos con ayuda incondicional a Rusia (en contraste con la ayuda extorsiva a Gran Bretaña) definieron el curso final de la guerra. Estados Unidos, preocupado por un cerco eurasiático (Alemania-Japón), vio en Rusia un aliado estratégico clave, resultando en un reparto de Europa en Yalta que marginó a Gran Bretaña. Los verdaderos vencedores, Estados Unidos y Rusia, no solo frustraron el cerco sino que también reconstruyeron a sus antiguos enemigos (Alemania y Japón), sentando las bases del orden geopolítico actual, donde las tensiones entre Estados Unidos y Europa, y la relación con Rusia, se mantienen sorprendentemente ancladas en estos mismos intereses históricos.</p></div>", "highlights": "<div class='analysis-content'><ul><li>La Segunda Guerra Mundial no fue una lucha moral entre buenos y malos, sino un conflicto impulsado por intereses geopolíticos permanentes de los estados, donde \"malos fueron todos\" al cometer atrocidades.</li><li>El \"milagro de Dunkerque\" fue un acto deliberado de Hitler, quien permitió la retirada británica con la expectativa de forzar un acuerdo que asegurara su frente occidental y le permitiera concentrarse en la Unión Soviética.</li><li>Gran Bretaña rearmó a Alemania y la \"empujó hacia el este\" contra la Unión Soviética, no por ingenuidad, sino como una estrategia consciente para contener la expansión rusa, encontrando en Hitler un líder furiosamente anticomunista útil para este fin.</li><li>El Holocausto tuvo una dimensión geopolítica en la que Gran Bretaña, para proteger su Mandato de Palestina y evitar la inmigración judía, impidió activamente el escape de refugiados judíos a Palestina, priorizando sus intereses imperiales sobre cualquier acción humanitaria.</li><li>La supuesta hermandad incondicional entre Estados Unidos y Gran Bretaña es un mito; EE.UU. inicialmente extorsionó a Gran Bretaña con ayuda condicionada y bases, y finalmente, a través de Eisenhower, tomó control del esfuerzo bélico aliado desde territorio británico, priorizando su alianza con Rusia y sus propios intereses estratégicos.</li></ul></div>", "references": "<div class='analysis-content'><ul><li>La guerra y la paz (Tolstoy)</li><li>The Pacific (Series)</li><li>Orden Mundial (Kissinger)</li><li>Arde París (Dominique Lapierre y Larry Collins)</li><li>Dissuación o Defensa (Lidl Hart, década del 60)</li></ul></div>", "transcript": "2025-08-27-2da-Guerra-Mundial.txt"}, "2025-07-13-Malvinas.html": {"summary": "<div class='analysis-content'><p>El podcast \"Geopolítica en Acción\", con Mauro La Bombarda y el Dr. Saturnino Funes, aborda el escenario geopolítico del Atlántico Sur a raíz de un reciente artículo de \"The Economist\" (8 de julio de 2025). Este artículo sugiere la cooperación entre Argentina y Gran Bretaña, junto con Estados Unidos, para proteger el Atlántico Sur de la influencia china, basándose en la necesidad argentina de modernizar sus fuerzas armadas y el interés estadounidense en la región tras la asunción del presidente Milei.</p><p>Los analistas desglosan la compleja red de actores globales y regionales. Identifican a Gran Bretaña con su ocupación militar de las Malvinas y la presencia de su flota, a China con su vasta flota pesquera que opera con la anuencia británica, y a Estados Unidos como una potencia global emergente en la región con crecientes intereses y una doctrina histórica (Doctrina Monroe) de no reconocimiento de la soberanía británica sobre las islas. Se señala la incoherencia de la propuesta británica, dado su propio vínculo con China y el objetivo estadounidense de expulsar potencias extracontinentales del hemisferio occidental.</p><p>Se examina la geopolítica del Cono Sur, destacando el \"equilibrio de poder\" que históricamente alinea a Brasil, Chile y Uruguay con Gran Bretaña como contrapeso a una Argentina fuerte. Los conductores argumentan que la \"política de seducción\" de Argentina hacia los Kelpers, y especialmente los acuerdos logísticos con Brasil, han debilitado la posición argentina. Se enfatiza que el reclamo argentino es crucial para la posición de \"no reconocimiento\" de Estados Unidos, siendo la única herramienta que la superpotencia tiene para presionar por el desalojo británico.</p><p>La conclusión central del análisis es que la estrategia más viable para Argentina implica una política hemisférica continental junto a Estados Unidos. Esto buscaría la expulsión de todas las potencias extracontinentales (incluyendo Gran Bretaña y China) del Atlántico Sur y la Antártida, con Malvinas como un objetivo clave dentro de este marco más amplio. Se advierte contra cualquier propuesta que legitime la presencia británica o divida la soberanía de las islas, considerándola una \"traición\" al interés nacional y continental.</p></div>", "highlights": "<div class='analysis-content'><ul><li>El vínculo entre Gran Bretaña y China en el Atlántico Sur es \"constructivo\", no conflictivo. La flota pesquera china pide permisos de pesca en Malvinas con la anuencia británica, desmintiendo la narrativa de rivalidad en la región.</li><li>El origen de la Doctrina Monroe fue un rechazo a la propuesta británica de defender conjuntamente el hemisferio occidental contra la Santa Alianza, estableciendo la postura estadounidense de \"América para los americanos\" de forma exclusiva.</li><li>La doctrina de \"no reconocimiento\" de la soberanía británica sobre Malvinas por parte de Estados Unidos se basa en la existencia del reclamo argentino. Si Argentina renunciara a su reclamo, Estados Unidos perdería el argumento legal para no reconocer la soberanía de facto de Gran Bretaña.</li><li>La propuesta británica de cooperación con Argentina y Estados Unidos contra China es interpretada como una \"bajada de línea\" para operadores británicos en Argentina, buscando legitimar su presencia y desviar una política continental genuina.</li><li>Cualquier propuesta de dividir las Islas Malvinas (por ejemplo, \"una isla para cada uno\") es caracterizada como una \"traición\" al interés nacional, equiparándola al relato bíblico del Rey Salomón para identificar a la verdadera \"madre\" de la causa.</li></ul></div>", "references": "<div class='analysis-content'><ul><li>The Economist (2025)</li><li>El Padrino</li></ul></div>", "transcript": "2025-07-13-Malvinas.txt"}, "2025-08-16-CementerioDeImperios.html": {"summary": "<div class='analysis-content'><p>El episodio de Geopolítica en Acción aborda la Primera y Segunda Guerra Mundial como un único período transformador. Se inicia discutiendo cómo la Primera Guerra Mundial, conocida entonces como \"La Gran Guerra\" que supuestamente pondría fin a todos los conflictos, en realidad provocó la caída de cuatro imperios (otomano, ruso, austríaco, alemán), el ascenso de Estados Unidos y el surgimiento de totalitarismos, sentando las bases para los eventos posteriores como la Revolución Rusa y la Guerra Fría. Se enfatiza que este conflicto fue la bisagra que desencadenó un proceso de varias décadas.</p><p>La discusión profundiza en la ruptura del sistema europeo de equilibrio de poder, vigente desde la Paz de Westfalia en 1648. Se analiza el ascenso de Alemania como potencia y su desafío a la hegemonía británica, particularmente en el ámbito naval, lo que llevó a una reconfiguración de alianzas. Se contrasta la política de Bismarck de alianzas flexibles para evitar guerras en dos frentes con la política del Kaiser Guillermo II, que propició la formación de bloques rígidos y una carrera armamentística, culminando en el estallido inevitable de la guerra, con el asesinato del archiduque como pretexto.</p><p>Un punto crucial del análisis es el año 1917, marcado por la retirada de Rusia de la guerra tras la Revolución Bolchevique, un evento en parte facilitado por Alemania para cerrar el frente oriental. Simultáneamente, Estados Unidos, tras una estrategia de manejar los tiempos y el incidente del telegrama Zimmermann, entró en el conflicto, aportando recursos y tropas frescas que resultaron decisivas para romper el estancamiento de la guerra de trincheras y asegurar la victoria aliada. Esta intervención marcó el inicio del ascenso global de EE.UU.</p><p>Finalmente, se examina el Tratado de Versalles, que no fue ratificado por Estados Unidos y generó un profundo resentimiento en Alemania al ser percibido como una humillación y no como una derrota militar completa. Las duras condiciones impuestas, especialmente por Francia, y el deseo británico de suavizarlas para mantener un equilibrio de poder en Europa, se señalan como elementos clave que no lograron evitar el futuro rearme alemán y configuraron el escenario para la Segunda Guerra Mundial y la creación de nuevos estados en Europa central, preparando el terreno para el próximo episodio.</p></div>", "highlights": "<div class='analysis-content'><ul><li>El término \"Primera Guerra Mundial\" es una construcción histórica posterior; los contemporáneos la conocían como \"La Gran Guerra\", creyendo que pondría fin a todos los conflictos.</li><li>Contrariamente a la creencia común, Gran Bretaña inicialmente percibía al Imperio Ruso como una amenaza mayor que Alemania, formando alianzas como la de 1902 con Japón para contrarrestar a Rusia.</li><li>Según Merheimer, la decisión alemana de construir una gran flota para desafiar el dominio naval británico fue una medida estratégica \"irracional\", impulsada por capricho interno más que por objetivos geopolíticos sólidos.</li><li>Bismarck logró manejar un complejo sistema de alianzas, incluso con rivales como Austria y Rusia, para evitar que Alemania luchara en dos frentes, una habilidad que se desintegró tras su partida.</li><li>Alemania jugó un papel directo en fomentar la Revolución Bolchevique al facilitar el regreso de Vladimir Lenin a Rusia desde Suiza, con el objetivo de desestabilizar el Frente Oriental y forzar la retirada rusa de la guerra.</li></ul></div>", "references": "<div class='analysis-content'><ul><li>La Batalla de Dorking</li><li>Cómo piensan los estados?</li><li>Los siete pilares de la sabiduría</li><li>Lawrence de Arabia (1962)</li></ul></div>", "transcript": "2025-08-16-CementerioDeImperios.txt"}, "2025-08-06-China.html": {"summary": "<div class='analysis-content'><p>El episodio de podcast inicia abordando el Mar Meridional de China y el Indo-Pacífico como el escenario central de la geopolítica actual, enmarcado en la confrontación entre Estados Unidos y China. Se explora cómo históricamente, desde la Guerra Fría, EE. UU. ha buscado evitar la hegemonía de una única potencia en la región, llegando incluso a una alianza tácita con China contra la Unión Soviética, tal como se plasmó en la Declaración de Shanghái.</p><p>Tras la caída de la URSS, la política exterior estadounidense, especialmente bajo la primera presidencia de Clinton, se caracterizó por un cierto \"descuido\" de la región, influenciada por la teoría del \"fin de la historia\" y una fe en la globalización. Paradójicamente, la integración de China a la OMC, impulsada por EE. UU., catalizó su crecimiento económico exponencial, sentando las bases de su actual poderío, a pesar de las voces que ya entonces advertían sobre un posible rival emergente.</p><p>A partir de los años 2000, y ante la creciente influencia militar y económica de China, EE. UU. inicia un \"giro hacia Asia\" con Obama, reforzando su presencia militar y estableciendo acuerdos de defensa con países clave como Japón y Vietnam. Esta estrategia responde a la preocupación de los países de la región, que buscan la protección estadounidense frente a China, mientras intentan mantener una \"autonomía estratégica\" mediante el \"hedging\" para evitar una sumisión total a cualquiera de las dos potencias.</p><p>La relación de China con sus vecinos es compleja, con pocos aliados verdaderos y una rivalidad geopolítica con Rusia, disimulada por declaraciones de amistad. Se analiza si China aspira a una hegemonía global, concluyendo que su proyección militar se concentra regionalmente y que su influencia global es principalmente económica, aunque con prácticas que algunos califican de neocolonialistas. EE. UU., por su parte, continúa fortaleciendo su presencia militar en el Indo-Pacífico, desmintiendo la idea de un repliegue, y manteniendo a Taiwán como un punto estratégico vital.</p></div>", "highlights": "<div class='analysis-content'><ul><li>Estados Unidos y China compartieron el objetivo de evitar que una potencia (la Unión Soviética) se volviera hegemónica en la región del Indo-Pacífico durante la Guerra Fría, un acuerdo sellado en la Declaración de Shanghái.</li><li>Estados Unidos fue un \"protagonista fundamental\" en el crecimiento exponencial de China al integrarla a la Organización Mundial de Comercio (OMC), lo que triplicó su PBI y la convirtió en una potencia económica.</li><li>Por primera vez en su historia, Estados Unidos vendió armas a un país comunista, Vietnam, marcando un giro estratégico debido a la creciente amenaza de China en el Mar Meridional.</li><li>La constante necesidad de Rusia y China de proclamar una \"amistad sin límites\" sugiere que su relación es más una alianza por conveniencia geopolítica que una verdadera afinidad, especialmente dada su rivalidad por influencia en Asia Central.</li><li>China evita alianzas militares rígidas porque, a diferencia de la Alemania pre-Primera Guerra Mundial que se vio arrastrada a un conflicto por sus compromisos, busca un \"ascenso pacífico\" y expansión económica para crear esferas de influencia.</li></ul></div>", "references": "<div class='analysis-content'><ul><li>El fin de la historia</li><li>Game of Thrones</li></ul></div>", "transcript": "2025-08-06-China.txt"}, "2023-08-23-Malvinas.html": {"summary": "<div class='analysis-content'><p>El podcast \"Geopolítica en Acción\" inicia un análisis geopolítico de la Guerra de Malvinas, trascendiendo las visiones endógenas y patrióticas para enfocar en el contexto global. Se destaca que, si bien las islas tienen un tamaño modesto, el escenario real del conflicto abarca 6 millones de kilómetros cuadrados en el Atlántico Sur, una zona de crucial importancia comercial, de recursos y de acceso a la Antártida, donde Brasil, Argentina, el Reino Unido y Estados Unidos tienen intereses.</p><p>La discusión profundiza en los antecedentes exógenos del conflicto, remontándose a la Doctrina Monroe de 1833, cuando Estados Unidos no pudo hacer valer su postura contra la ocupación británica por falta de capacidad marítima, pero estableció su política de no reconocimiento de la soberanía británica, la cual mantiene hasta hoy. Luego se aborda el proceso de descolonización post-Segunda Guerra Mundial y la lección aprendida por Gran Bretaña de la Guerra del Canal de Suez (1956), donde la intervención conjunta de EE.UU. y la Unión Soviética la obligó a retirarse, evidenciando su dependencia de la aprobación estadounidense para acciones militares.</p><p>Se presenta una analogía con la Guerra de Yom Kippur (1973), sugiriendo que Estados Unidos podría haber orquestado o consentido una invasión para forzar a un aliado (Israel, en ese caso; potencialmente el Reino Unido en el de Malvinas) a ceder a sus intereses geopolíticos. En el contexto de 1982, se analiza el quiebre de la Alianza Atlántica, provocado por la decisión europea (incluida Gran Bretaña) de construir un gasoducto con la Unión Soviética, desafiando a Ronald Reagan y generando una división en la política exterior estadounidense entre 'atlantistas' y 'continentalistas'.</p><p>Este complejo escenario geopolítico, con Gran Bretaña desafiando a EE.UU. y una facción 'continentalista' en Washington buscando fortalecer lazos con dictaduras sudamericanas para combatir el comunismo, es presentado como el caldo de cultivo para la 'sorpresiva' recuperación argentina de las Malvinas. El episodio concluye con la reveladora anécdota de una cena de gala en la embajada argentina en Washington la noche del 2 de abril de 1982, en honor a Jeane Kirkpatrick (líder 'continentalista'), a la que asistió medio gabinete de Reagan, insinuando un posible aval o, al menos, un conocimiento previo de la acción argentina.</p></div>", "highlights": "<div class='analysis-content'><ul><li>Las Islas Malvinas, aunque pequeñas en sí mismas, son parte de un escenario geopolítico mucho más vasto en el Atlántico Sur, que abarca 6 millones de kilómetros cuadrados, crucial para el comercio global y la proyección antártica.</li><li>Desde 1833, Estados Unidos nunca ha reconocido la soberanía británica sobre las Islas Malvinas, manteniendo una doctrina de no reconocimiento oficial que, si bien no favorece directamente a Argentina, tampoco convalida la posición británica.</li><li>La Guerra del Canal de Suez en 1956 enseñó a Gran Bretaña que no podía lanzar operaciones militares sin la autorización de Estados Unidos, una lección que tuvo un impacto directo en su estrategia posterior, incluida la respuesta a Malvinas.</li><li>La invasión argentina de Malvinas en 1982 ocurrió en un momento de grave fractura de la Alianza Atlántica, cuando Europa (incluido el Reino Unido) desafió directamente a Estados Unidos al construir un gasoducto con la Unión Soviética.</li><li>La presencia de medio gabinete de Ronald Reagan en una cena en la embajada argentina en Washington la noche del 2 de abril de 1982, honrando a la 'continentalista' Jeane Kirkpatrick, sugiere un posible aval o conocimiento previo de la operación argentina por parte de una facción de la administración estadounidense.</li></ul></div>", "references": "<div class='analysis-content'></div>", "transcript": "2023-08-23-Malvinas.txt"}, "2023-09-01-Malvinas.html": {"summary": "<div class='analysis-content'><p>Este episodio de Geopolítica en Acción retoma el análisis del conflicto de Malvinas, posicionándolo no como un evento bélico aislado, sino como parte de una estrategia geopolítica global. Se recapituló el enfrentamiento entre Estados Unidos y Europa Occidental por el gasoducto soviético, y la postura estadounidense a favor de una alianza hemisférica (continentalista) frente a la atlantista, destacando el rol de figuras como Alexander Haig y Jeane Kirkpatrick.</p><p>La discusión profundizó en la hipótesis de que la acción argentina en Malvinas fue, en parte, estimulada por Estados Unidos como una represalia a la postura británica sobre el gasoducto. Se debatió si Galtieri actuó impulsado por necesidades políticas domésticas o por el aval implícito de la facción continentalista estadounidense. Los anfitriones señalan una cena en la embajada argentina en Washington, posterior al 2 de abril, con altos funcionarios de Reagan, como indicio de este apoyo inicial.</p><p>El podcast detalla la posterior mediación fallida de Estados Unidos a través de Alexander Haig, obstaculizada por Kirkpatrick, y la propuesta de paz de las “Tres Banderas” formulada por Ronald Reagan vía Perú, que Gran Bretaña se vio obligada a aceptar. El hundimiento del ARA General Belgrano por parte británica es interpretado como una provocación estratégica para que Argentina rechazara dicho acuerdo. Se critica la \"torpeza\" y posible \"traición\" argentina al rechazar múltiples propuestas de paz y alinear su canciller con Cuba, lo que llevó a Estados Unidos a volcar su apoyo total a Gran Bretaña.</p><p>Finalmente, se aborda la \"desmalvinización\" post-guerra en Argentina y el consecuente fortalecimiento militar británico en la región. Se analizan las perspectivas futuras para la recuperación de las islas, destacando la importancia geopolítica del paso interoceánico y la proyección antártica. Se enfatiza que la postura invariable de Estados Unidos de no reconocer la soberanía británica y su constante llamado al diálogo bilateral son claves, sugiriendo que la recuperación de Malvinas se decidirá en Washington, no en Londres, en un futuro momento de quiebre entre EE.UU. y el Reino Unido.</p></div>", "highlights": "<div class='analysis-content'><ul><li>La invasión argentina de Malvinas en 1982 no fue puramente una decisión interna motivada por problemas domésticos, sino que pudo haber sido estimulada por Estados Unidos como una represalia a la negativa británica de abandonar la construcción del gasoducto soviético, dada la fuerte vinculación de Galtieri con la facción continentalista estadounidense.</li><li>Después del 2 de abril de 1982, altos funcionarios del gobierno de Ronald Reagan asistieron y brindaron en una cena en la Embajada Argentina en Washington en homenaje a Jeane Kirkpatrick, lo que sugiere un tácito apoyo inicial o, al menos, la no condena inmediata de la acción argentina por parte de sectores de la administración estadounidense.</li><li>Contrariamente al mito de la \"desmalvinización\" de que Argentina no estaba preparada para la guerra, Alexander Haig en sus memorias revela que partes del poder norteamericano (Casa Blanca, Pentágono, CIA) e incluso algunos militares británicos creían que las fuerzas argentinas podían derrotar a los británicos en una guerra por las Malvinas.</li><li>El hundimiento del ARA General Belgrano por Gran Bretaña, fuera de la zona de exclusión, es interpretado como una jugada estratégica para provocar a Argentina a rechazar la propuesta de paz de las \"Tres Banderas\", que el Reino Unido se vio forzado a aceptar bajo presión de Estados Unidos pero que consideraba perjudicial a sus intereses.</li><li>Estados Unidos ha mantenido una postura constante y firme a favor de la negociación por la soberanía de Malvinas, no reconociendo la soberanía británica y abogando por un diálogo bilateral entre Argentina y Gran Bretaña. Se sugiere que la recuperación de las islas dependerá de un futuro quiebre geopolítico entre Estados Unidos y el Reino Unido, y que \"las Malvinas se recuperan en Washington\".</li></ul></div>", "references": "<div class='analysis-content'><ul><li>Alexander Haig's memoirs</li></ul></div>", "transcript": "2023-09-01-Malvinas.txt"}};

                // Update active tab content
                const targetId = e.target.getAttribute('data-target');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Populate graph list
        function populateGraphList() {
            const graphList = document.getElementById('graph-list');
            
            graphs.forEach((graph, index) => {
                const li = document.createElement('li');
                li.className = 'graph-item';
                li.dataset.index = index;
                li.innerHTML = `
                    <div class="graph-name">${graph.name}</div>
                    <div class="graph-meta">${graph.description}</div>
                `;
                
                li.addEventListener('click', () => loadGraph(index));
                graphList.appendChild(li);
            });
        }

        // Load a graph
        function loadGraph(index) {
            const graph = graphs[index];
            
            // Update active state
            document.querySelectorAll('.graph-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            // Update header
            document.getElementById('selected-title').textContent = graph.name;
            document.getElementById('selected-description').textContent = graph.description;

            // Show loading
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // Remove existing iframe if any
            const existingIframe = document.querySelector('#graph-viewer iframe');
            if (existingIframe) {
                existingIframe.remove();
            }

            // Create and load iframe
            const iframe = document.createElement('iframe');
            iframe.src = `artifacts/${graph.file}`;
            iframe.onload = () => {
                document.getElementById('loading').classList.add('hidden');
            };
            iframe.onerror = () => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('placeholder').classList.remove('hidden');
                document.querySelector('.placeholder-text').textContent = 'Error al cargar el grafo';
                document.querySelector('.placeholder-hint').textContent = 'No se pudo cargar el archivo del grafo';
            };

            document.getElementById('graph-viewer').appendChild(iframe);
            currentGraph = index;

            // Load textual insights
            const graphAnalysis = analysisDataCache[graph.file];

            if (graphAnalysis) {
                document.getElementById('insights-panel').classList.remove('hidden');
                
                document.getElementById('tab-summary').innerHTML = graphAnalysis.summary || '<div class="analysis-content"><p>No hay resumen disponible.</p></div>';
                
                const highlightsObj = graphAnalysis.highlights || '';
                document.getElementById('tab-highlights').innerHTML = highlightsObj || '<div class="analysis-content"><p>No hay destacados disponibles.</p></div>';
                
                const refObj = graphAnalysis.references || '';
                const refTab = document.getElementById('tab-references');
                const btnRef = document.getElementById('btn-references');
                
                // If there are no references (empty or just tags with no content like <ul></ul>)
                if (!refObj || refObj.trim() === '' || refObj.includes('<ul></ul>') || refObj === "<div class='analysis-content'></div>") {
                    btnRef.classList.add('hidden');
                    refTab.innerHTML = '';
                    // if reference tab was active, switch to summary
                    if (btnRef.classList.contains('active')) {
                        btnRef.classList.remove('active');
                        document.querySelector('.tab-btn[data-target="tab-summary"]').click();
                    }
                } else {
                    btnRef.classList.remove('hidden');
                    refTab.innerHTML = refObj;
                }
            } else {
                document.getElementById('insights-panel').classList.add('hidden');
            }

        }

        // Handle messages from iframes (e.g., global graph)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'loadReport') {
                const name = event.data.name;
                const index = graphs.findIndex(g => g.name === name);
                if (index !== -1) {
                    loadGraph(index);
                    // Scroll to top to show the graph
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    console.warn(`Report with name "${name}" not found.`);
                }
            }
        });

        // Initialize
        populateGraphList();
    </script>
</body>
</html>
